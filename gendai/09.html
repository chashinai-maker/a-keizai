const ITER=200000;
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(blob,pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(blob.s),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(blob.i)},key,ub(blob.c));
  return new TextDecoder().decode(pt);
}
